spring.application.name=ai-ticket-triage
spring.datasource.url=jdbc:postgresql://localhost:5432/triage
spring.datasource.username=triage
spring.datasource.password=triage
spring.jpa.hibernate.ddl-auto=update
spring.kafka.bootstrap-servers=localhost:9092
spring.data.redis.host=localhost
spring.data.redis.port=6379
management.endpoints.web.exposure.include=health,prometheus
spring.threads.virtual.enabled=true
# Consumers with the same group id share the work of reading a topic
spring.kafka.consumer.group-id=triage-group
# On first start, read the topic from the beginning so no early messages are missed
spring.kafka.consumer.auto-offset-reset=earliest
# Read from the environment so the key never ends up in Git
anthropic.api-key=${ANTHROPIC_API_KEY}
# Small, fast, cheap model, which is enough for classification
anthropic.model=claude-haiku-5-5
# Let Spring AI create its vector_store table on startup
spring.ai.vectorstore.pgvector.initialize-schema=true
# Load the embedding model from disk instead of downloading it at startup
spring.ai.embedding.transformer.onnx.modelUri=file:/Users/agawas/models/all-MiniLM-L6-v2/model.onnx
spring.ai.embedding.transformer.tokenizer.uri=file:/Users/agawas/models/all-MiniLM-L6-v2/tokenizer.json
# How long a cached classification stays valid
triage.cache.ttl-minutes=60
# Fail fast if Redis is down, so a cache outage never stalls the pipeline
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s
# Minimum cosine similarity (0 to 1) for a past ticket to count as "the same ticket"
triage.semantic-cache.threshold=0.7
# Tag every metric with the app name so dashboards can filter on it
management.metrics.tags.application=ai-ticket-triage
# Also record timings of each Kafka listener invocation
spring.kafka.listener.observation-enabled=true
# How long a resolved ticket stays visible in the live queue
triage.resolved-visible-minutes=5
# Max ticket submissions per client IP per minute (fixed window, counted in Redis)
triage.rate-limit.per-minute=120